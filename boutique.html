<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StudentFlow - Boutique Récompenses</title>
    <script src="./tailwind.min.js"></script>
    <style>
        :root {
            --p: #6366f1;
            --s: #f43f5e;
            --bg: #0b0f1a;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, transparent 50%),
                radial-gradient(circle at 0% 100%, #111827 0%, transparent 50%);
            z-index: -1;
        }

        .glass {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            transition: all 0.3s ease;
        }

        .glass:hover {
            border-color: rgba(99, 102, 241, 0.3);
            transform: translateY(-2px);
        }

        .shop-item {
            position: relative;
            overflow: hidden;
        }

        .shop-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: left 0.5s;
        }

        .shop-item:hover::after {
            left: 100%;
        }

        .btn-buy {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-buy:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }

        .btn-buy:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .owned-badge {
            background: linear-gradient(135deg, #10b981, #059669);
        }

        .toast {
            animation: slideUp 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(100px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { opacity: 0; transform: translateY(-20px); }
        }

        .coin-bounce {
            animation: coinBounce 0.6s ease;
        }

        @keyframes coinBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }

        .category-btn.active {
            background: rgba(99, 102, 241, 0.3);
            border-color: #6366f1;
            color: #a5b4fc;
        }

        .shop-item h3 {
            min-height: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .shop-item p {
            min-height: 2em;
            display: flex;
            align-items: center;
        }

        .category-section-title {
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            padding: 4px 0;
        }
    </style>
</head>

<body>
    <div class="bg-glow"></div>

    <!-- Header -->
    <header class="sticky top-0 z-50 backdrop-blur-xl border-b border-white/5 px-4 py-3">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="studentflow_ultimate_pro.html" class="flex items-center justify-center w-9 h-9 rounded-xl bg-white/5 hover:bg-white/10 transition-colors" title="Retour">
                    <span class="text-lg">←</span>
                </a>
                <span class="text-2xl">🛍️</span>
                <div>
                    <h1 class="text-lg font-black bg-gradient-to-r from-indigo-400 to-purple-400 bg-clip-text text-transparent">
                        Boutique Récompenses
                    </h1>
                    <p class="text-[10px] text-slate-500">Dépense tes points sagesse</p>
                </div>
            </div>
            <div class="glass px-4 py-2 flex items-center gap-2">
                <span class="text-xl" id="coin-icon">✨</span>
                <span id="wallet" class="text-xl font-black text-amber-400">0</span>
                <span class="text-xs text-slate-500">pts</span>
            </div>
        </div>
    </header>

    <!-- Category Filter -->
    <div class="max-w-4xl mx-auto px-4 mt-4">
        <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
            <button class="category-btn active glass px-4 py-2 text-xs font-bold rounded-full whitespace-nowrap border border-transparent" onclick="filterCategory('all')">
                🏪 Tout
            </button>
            <button class="category-btn glass px-4 py-2 text-xs font-bold rounded-full whitespace-nowrap text-slate-400 border border-transparent" onclick="filterCategory('theme')">
                🎨 Thèmes
            </button>
            <button class="category-btn glass px-4 py-2 text-xs font-bold rounded-full whitespace-nowrap text-slate-400 border border-transparent" onclick="filterCategory('avatar')">
                👤 Avatars
            </button>
            <button class="category-btn glass px-4 py-2 text-xs font-bold rounded-full whitespace-nowrap text-slate-400 border border-transparent" onclick="filterCategory('boost')">
                ⚡ Boosts
            </button>
            <button class="category-btn glass px-4 py-2 text-xs font-bold rounded-full whitespace-nowrap text-slate-400 border border-transparent" onclick="filterCategory('fun')">
                🎉 Fun
            </button>
        </div>
    </div>

    <!-- Shop Content -->
    <main class="max-w-4xl mx-auto px-4 py-4">
        <div id="shop-grid">
            <!-- Items injected by JS -->
        </div>
    </main>

    <!-- Inventory Section -->
    <section class="max-w-4xl mx-auto px-4 pt-4 pb-8 mb-[env(safe-area-inset-bottom)]">
        <div class="glass p-4">
            <div class="flex items-center gap-2 mb-3">
                <span class="text-xl">🎒</span>
                <h2 class="text-sm font-black text-slate-300">Mon Inventaire</h2>
                <span id="inventory-count" class="ml-auto text-xs font-bold text-indigo-400 bg-indigo-500/20 px-2 py-1 rounded-full">0</span>
            </div>
            <div id="inventory-list" class="flex flex-wrap gap-2">
                <p class="text-xs text-slate-500 italic" id="empty-inventory">Aucun objet acheté</p>
            </div>
        </div>
    </section>

    <!-- Toast Container -->
    <div id="toast-container" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2"></div>

    <script>
        // ==================== SHOP DATA ====================
        const SHOP_ITEMS = [
            // Thèmes
            { id: 'theme_ocean', name: 'Thème Océan', desc: 'Couleurs apaisantes bleues', icon: '🌊', price: 50, category: 'theme' },
            { id: 'theme_sunset', name: 'Thème Coucher de Soleil', desc: 'Dégradé orange-rose', icon: '🌅', price: 50, category: 'theme' },
            { id: 'theme_forest', name: 'Thème Forêt', desc: 'Tons verts nature', icon: '🌲', price: 50, category: 'theme' },
            { id: 'theme_galaxy', name: 'Thème Galaxie', desc: 'Couleurs cosmiques', icon: '🌌', price: 100, category: 'theme' },
            { id: 'theme_neon', name: 'Thème Néon', desc: 'Style cyberpunk', icon: '💜', price: 100, category: 'theme' },
            { id: 'theme_gold', name: 'Thème Or', desc: 'Luxe et prestige', icon: '👑', price: 200, category: 'theme' },

            // Avatars
            { id: 'avatar_ninja', name: 'Avatar Ninja', desc: 'Silencieux mais efficace', icon: '🥷', price: 30, category: 'avatar' },
            { id: 'avatar_wizard', name: 'Avatar Mage', desc: 'Maître de la sagesse', icon: '🧙', price: 30, category: 'avatar' },
            { id: 'avatar_astronaut', name: 'Avatar Astronaute', desc: 'Explore l\'infini', icon: '🧑‍🚀', price: 50, category: 'avatar' },
            { id: 'avatar_robot', name: 'Avatar Robot', desc: 'Productivité maximale', icon: '🤖', price: 50, category: 'avatar' },
            { id: 'avatar_dragon', name: 'Avatar Dragon', desc: 'Puissance légendaire', icon: '🐉', price: 150, category: 'avatar' },
            { id: 'avatar_unicorn', name: 'Avatar Licorne', desc: 'Rare et magique', icon: '🦄', price: 200, category: 'avatar' },

            // Boosts
            { id: 'boost_xp2', name: 'XP x2 (1 jour)', desc: 'Double les points gagnés', icon: '⚡', price: 80, category: 'boost' },
            { id: 'boost_streak_shield', name: 'Bouclier Streak', desc: 'Protège ton streak 1 fois', icon: '🛡️', price: 60, category: 'boost' },
            { id: 'boost_wisdom_bomb', name: 'Bombe de Sagesse', desc: '+25 points bonus', icon: '💣', price: 40, category: 'boost' },
            { id: 'boost_lucky_star', name: 'Étoile Chanceuse', desc: 'Bonus aléatoire 1-50 pts', icon: '⭐', price: 35, category: 'boost' },

            // Fun
            { id: 'fun_confetti', name: 'Pluie de Confettis', desc: 'Fête sur ton écran!', icon: '🎊', price: 20, category: 'fun' },
            { id: 'fun_fireworks', name: 'Feux d\'Artifice', desc: 'Animation spectaculaire', icon: '🎆', price: 25, category: 'fun' },
            { id: 'fun_trophy', name: 'Trophée Doré', desc: 'Badge de collection', icon: '🏆', price: 100, category: 'fun' },
            { id: 'fun_crown', name: 'Couronne Royale', desc: 'Tu es le/la meilleur(e)', icon: '👑', price: 150, category: 'fun' },
            { id: 'fun_diploma', name: 'Diplôme d\'Honneur', desc: 'Récompense ultime', icon: '📜', price: 300, category: 'fun' },
            { id: 'fun_pet_cat', name: 'Chat Virtuel', desc: 'Ton compagnon d\'études', icon: '🐱', price: 120, category: 'fun' },
        ];

        // ==================== STATE ====================
        const BOUTIQUE_KEY = 'sf_boutique';
        let boutiqueState = loadBoutiqueState();
        let currentCategory = 'all';

        function loadBoutiqueState() {
            try {
                const data = localStorage.getItem(BOUTIQUE_KEY);
                if (data) return JSON.parse(data);
            } catch (e) { console.error(e); }
            return { owned: [], activeTheme: null, activeAvatar: null };
        }

        function saveBoutiqueState() {
            localStorage.setItem(BOUTIQUE_KEY, JSON.stringify(boutiqueState));
        }

        function getWisdom() {
            try {
                const keys = ['sf_ultimate_pro_v2', 'sf_ultimate_pro'];
                for (const key of keys) {
                    const data = localStorage.getItem(key);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.gamification) return parsed.gamification.wisdom || 0;
                    }
                }
            } catch (e) { console.error(e); }
            return 0;
        }

        function setWisdom(value) {
            try {
                const keys = ['sf_ultimate_pro_v2', 'sf_ultimate_pro'];
                for (const key of keys) {
                    const data = localStorage.getItem(key);
                    if (data) {
                        const parsed = JSON.parse(data);
                        if (parsed.gamification) {
                            parsed.gamification.wisdom = value;
                            parsed.gamification.level = Math.floor(value / 100) + 1;
                            localStorage.setItem(key, JSON.stringify(parsed));
                            return true;
                        }
                    }
                }
            } catch (e) { console.error(e); }
            return false;
        }

        // ==================== RENDERING ====================
        const CATEGORY_LABELS = {
            theme: { icon: '🎨', label: 'Thèmes' },
            avatar: { icon: '👤', label: 'Avatars' },
            boost: { icon: '⚡', label: 'Boosts' },
            fun: { icon: '🎉', label: 'Fun' }
        };

        function renderItemCard(item, wisdom) {
            const owned = boutiqueState.owned.includes(item.id);
            const canBuy = wisdom >= item.price && !owned;
            const isActiveTheme = boutiqueState.activeTheme === item.id;
            const isActiveAvatar = boutiqueState.activeAvatar === item.id;
            const isActive = isActiveTheme || isActiveAvatar;

            let actionHtml;
            if (owned && (item.category === 'theme' || item.category === 'avatar')) {
                if (isActive) {
                    actionHtml = `<span class="owned-badge text-[10px] font-bold text-white px-3 py-1 rounded-full" style="background: linear-gradient(135deg, #6366f1, #8b5cf6);">⭐ Actif</span>`;
                } else {
                    actionHtml = `<button class="btn-buy w-full py-2 rounded-xl text-xs font-bold bg-gradient-to-r from-emerald-600 to-teal-600 text-white" onclick="activateItem('${item.id}')">Activer</button>`;
                }
            } else if (owned) {
                actionHtml = `<span class="owned-badge text-[10px] font-bold text-white px-3 py-1 rounded-full">✓ Obtenu</span>`;
            } else {
                actionHtml = `<button class="btn-buy w-full py-2 rounded-xl text-xs font-bold ${canBuy
                    ? 'bg-gradient-to-r from-indigo-600 to-purple-600 text-white'
                    : 'bg-slate-800 text-slate-500'}"
                    ${canBuy ? '' : 'disabled'}
                    onclick="buyItem('${item.id}')">
                    ${canBuy ? 'Acheter' : 'Pas assez'}
                </button>`;
            }

            return `
            <div class="shop-item glass p-4 flex flex-col items-center text-center gap-2 ${isActive ? 'border-indigo-500/50' : ''}" data-category="${item.category}">
                <span class="text-4xl">${item.icon}</span>
                <h3 class="text-xs font-bold text-white leading-tight">${item.name}</h3>
                <p class="text-[10px] text-slate-500 leading-tight">${item.desc}</p>
                <div class="flex items-center gap-1 mt-auto">
                    <span class="text-amber-400 text-xs">✨</span>
                    <span class="text-sm font-black ${canBuy ? 'text-amber-400' : owned ? 'text-emerald-400' : 'text-red-400'}">${item.price}</span>
                </div>
                ${actionHtml}
            </div>`;
        }

        function renderShop() {
            const grid = document.getElementById('shop-grid');
            const wisdom = getWisdom();
            document.getElementById('wallet').textContent = wisdom;

            if (currentCategory === 'all') {
                const categories = ['theme', 'avatar', 'boost', 'fun'];
                grid.innerHTML = categories.map(cat => {
                    const catItems = SHOP_ITEMS.filter(i => i.category === cat);
                    const info = CATEGORY_LABELS[cat];
                    return `
                    <div class="mb-4">
                        <div class="category-section-title flex items-center gap-2 mb-2">
                            <span>${info.icon}</span>
                            <span>${info.label}</span>
                        </div>
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                            ${catItems.map(item => renderItemCard(item, wisdom)).join('')}
                        </div>
                    </div>`;
                }).join('');
            } else {
                const items = SHOP_ITEMS.filter(i => i.category === currentCategory);
                grid.innerHTML = `
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                    ${items.map(item => renderItemCard(item, wisdom)).join('')}
                </div>`;
            }

            renderInventory();
        }

        function renderInventory() {
            const list = document.getElementById('inventory-list');
            const emptyMsg = document.getElementById('empty-inventory');
            const countEl = document.getElementById('inventory-count');
            const ownedItems = SHOP_ITEMS.filter(i => boutiqueState.owned.includes(i.id));

            countEl.textContent = ownedItems.length;

            if (ownedItems.length === 0) {
                emptyMsg.style.display = '';
                list.innerHTML = '<p class="text-xs text-slate-500 italic" id="empty-inventory">Aucun objet acheté</p>';
                return;
            }

            list.innerHTML = ownedItems.map(item => {
                const isActive = boutiqueState.activeTheme === item.id || boutiqueState.activeAvatar === item.id;
                return `<div class="flex items-center gap-2 bg-white/5 px-3 py-2 rounded-xl ${isActive ? 'border border-indigo-500/50' : ''}">
                    <span class="text-lg">${item.icon}</span>
                    <span class="text-[10px] font-bold text-slate-300">${item.name}</span>
                    ${isActive ? '<span class="text-[8px] text-indigo-400 font-bold">ACTIF</span>' : ''}
                </div>`;
            }).join('');
        }

        // ==================== ACTIONS ====================
        function buyItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) return;

            const wisdom = getWisdom();
            if (wisdom < item.price || boutiqueState.owned.includes(item.id)) return;

            // Deduct points
            setWisdom(wisdom - item.price);
            boutiqueState.owned.push(item.id);
            saveBoutiqueState();

            // Coin bounce animation
            const coinIcon = document.getElementById('coin-icon');
            coinIcon.classList.add('coin-bounce');
            setTimeout(() => coinIcon.classList.remove('coin-bounce'), 600);

            // Apply boost effects immediately
            if (item.id === 'boost_wisdom_bomb') {
                const current = getWisdom();
                setWisdom(current + 25);
                showToast('💣 +25 points de sagesse bonus!');
            } else if (item.id === 'boost_lucky_star') {
                const bonus = Math.floor(Math.random() * 50) + 1;
                const current = getWisdom();
                setWisdom(current + bonus);
                showToast(`⭐ Étoile Chanceuse: +${bonus} points!`);
            } else {
                showToast(`${item.icon} ${item.name} obtenu!`);
            }

            // Consumable boosts can be re-bought
            if (item.category === 'boost') {
                boutiqueState.owned = boutiqueState.owned.filter(id => id !== item.id);
                saveBoutiqueState();
            }

            renderShop();
        }

        function activateItem(itemId) {
            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item || !boutiqueState.owned.includes(item.id)) return;

            if (item.category === 'theme') {
                boutiqueState.activeTheme = itemId;
                showToast(`${item.icon} ${item.name} activé!`);
            } else if (item.category === 'avatar') {
                boutiqueState.activeAvatar = itemId;
                showToast(`${item.icon} ${item.name} activé!`);
            }

            saveBoutiqueState();
            renderShop();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase().includes(getCategoryLabel(cat))) {
                    btn.classList.add('active');
                }
            });
            renderShop();
        }

        function getCategoryLabel(cat) {
            const labels = { all: 'tout', theme: 'thèmes', avatar: 'avatars', boost: 'boosts', fun: 'fun' };
            return labels[cat] || '';
        }

        function showToast(message) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast glass px-4 py-3 text-xs font-bold text-center';
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // ==================== INIT ====================
        renderShop();
    </script>
</body>

</html>
